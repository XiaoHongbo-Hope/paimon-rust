name: Package native-plan SDK bundle

on:
  workflow_dispatch:
    inputs:
      rust_run_id:
        description: Successful Python binding workflow run ID
        required: true
      paimon_ref:
        description: Apache Paimon revision
        required: true
        default: "30bfd4a600a930079b15f5e6bacea34b8d3ff4c8"

permissions:
  actions: read
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: apache/paimon
          ref: ${{ inputs.paimon_ref }}
          path: paimon

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download pypaimon-rust wheels
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rust_run_id }}
          pattern: wheels-*
          merge-multiple: true
          path: rust-artifacts

      - name: Build PyPaimon distributions
        run: |
          python -m pip install build
          python -m build --wheel --sdist paimon/paimon-python --outdir pypaimon-dist

      - name: Assemble cross-platform bundle
        run: |
          python .github/native-plan-bundle/assemble.py \
            --rust-artifacts rust-artifacts \
            --pypaimon-dist pypaimon-dist \
            --templates .github/native-plan-bundle \
            --output bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: pypaimon-native-plan-2.1.dev20260809-rust20260810
          path: |
            bundle/pypaimon-native-plan-2.1.dev20260809-rust20260810.zip
            bundle/pypaimon-native-plan-2.1.dev20260809-rust20260810.zip.sha512
          if-no-files-found: error
