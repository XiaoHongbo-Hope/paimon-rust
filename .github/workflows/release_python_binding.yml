name: Build temporary pypaimon-rust rc1010

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-rc1010
  cancel-in-progress: false

jobs:
  linux-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833
        with:
          tool: cargo-about@0.9.1
      - name: Prepare version and licenses
        run: |
          python3 scripts/python_release_version.py --tag v0.4.0-rc1010 --pyproject bindings/python/pyproject.toml
          cargo fetch --locked
          python3 scripts/release_licenses.py --stage-python x86_64-unknown-linux-gnu
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: v1.14.1
          working-directory: bindings/python
          target: x86_64-unknown-linux-gnu
          command: build
          args: --release --locked -o dist
          manylinux: manylinux2014
          before-script-linux: |
            yum install -y openssl11-devel
            ln -sf /usr/lib64/pkgconfig/openssl11.pc /usr/lib64/pkgconfig/openssl.pc
            ln -sf /usr/lib64/pkgconfig/libssl11.pc /usr/lib64/pkgconfig/libssl.pc
            ln -sf /usr/lib64/pkgconfig/libcrypto11.pc /usr/lib64/pkgconfig/libcrypto.pc
      - name: Verify and smoke test wheel
        run: |
          python scripts/verify_python_wheels.py --allow-partial bindings/python/dist
          pip install bindings/python/dist/*.whl
          python -c 'import pypaimon_rust; print(pypaimon_rust)'
          cd bindings/python/dist
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64-rc1010
          path: bindings/python/dist/*
      - name: Publish GitHub pre-release only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.0-rc1010 bindings/python/dist/* \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Temporary pypaimon-rust 0.4.0rc1010' \
            --notes "Linux x86_64 test wheel. Source: $GITHUB_SHA. Combines PR #1010 (BLOB tail prefetch), #1009 (native Variant projection), and #998 (BLOB index cache). Not an Apache release; not published to PyPI or TestPyPI."
